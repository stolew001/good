name: Build A4 Dewarp PDF APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/example/a4scanner

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "A4DewarpPdf"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.a4scanner'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.a4scanner"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "2.3"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:largeHeap="true"
                  android:label="A4無限制掃描儀"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/a4scanner/MainActivity.java
          package com.example.a4scanner;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.BitmapShader;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PointF;
          import android.graphics.Shader;
          import android.graphics.pdf.PdfDocument;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final int REQ_PICK_IMAGE = 1001;
              private static final int REQ_SAVE_PDF = 1002;
              private static final int A4_WIDTH = 1240;
              private static final int A4_HEIGHT = 1754;

              private DewarpView dewarpView;
              
              private List<Uri> pendingUris = new ArrayList<>();
              private List<File> tempFiles = new ArrayList<>();
              private int currentProcessingIndex = 0;
              
              // 0: 就緒, 1: 調整節點中, 2: 預覽結果
              private int currentState = 0; 
              private Bitmap previewBitmap = null;
              
              private TextView tvStatus;
              private Button btnMainAction;
              private Button btnRotate;
              private Button btnRetake;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#1E1E1E"));

                  tvStatus = new TextView(this);
                  tvStatus.setTextColor(Color.WHITE);
                  tvStatus.setTextSize(18f);
                  tvStatus.setGravity(Gravity.CENTER);
                  tvStatus.setPadding(0, 30, 0, 10);
                  root.addView(tvStatus);

                  dewarpView = new DewarpView(this);
                  LinearLayout.LayoutParams viewParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f);
                  root.addView(dewarpView, viewParams);

                  LinearLayout controls = new LinearLayout(this);
                  controls.setOrientation(LinearLayout.HORIZONTAL);
                  controls.setGravity(Gravity.CENTER);
                  controls.setPadding(16, 20, 16, 30);

                  btnRetake = new Button(this);
                  btnRetake.setText("重新調整");
                  btnRetake.setOnClickListener(v -> {
                      if (currentState == 2) {
                          currentState = 1;
                          dewarpView.showingPreview = false;
                          if (previewBitmap != null) {
                              previewBitmap.recycle();
                              previewBitmap = null;
                          }
                          updateUI();
                      }
                  });

                  btnRotate = new Button(this);
                  btnRotate.setText("旋轉 90°");
                  btnRotate.setOnClickListener(v -> {
                      if (dewarpView.sourceBitmap != null) {
                          dewarpView.rotateImage();
                      }
                  });

                  btnMainAction = new Button(this);
                  btnMainAction.setOnClickListener(v -> {
                      if (currentState == 0) {
                          pickImages();
                      } else if (currentState == 1) {
                          // 生成預覽
                          Toast.makeText(this, "產生預覽中...", Toast.LENGTH_SHORT).show();
                          btnMainAction.setEnabled(false);
                          btnRotate.setEnabled(false);
                          
                          new Thread(() -> {
                              previewBitmap = dewarpView.processDewarp(true);
                              runOnUiThread(() -> {
                                  btnMainAction.setEnabled(true);
                                  currentState = 2;
                                  dewarpView.showingPreview = true;
                                  updateUI();
                              });
                          }).start();
                      } else if (currentState == 2) {
                          // 確認預覽，寫入暫存並進入下一張
                          Toast.makeText(this, "儲存並準備下一張...", Toast.LENGTH_SHORT).show();
                          btnMainAction.setEnabled(false);
                          btnRetake.setEnabled(false);
                          
                          new Thread(() -> {
                              try {
                                  File tempFile = new File(getCacheDir(), "page_" + currentProcessingIndex + ".jpg");
                                  try (FileOutputStream out = new FileOutputStream(tempFile)) {
                                      previewBitmap.compress(Bitmap.CompressFormat.JPEG, 90, out);
                                  }
                                  tempFiles.add(tempFile);
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                              
                              if (previewBitmap != null) {
                                  previewBitmap.recycle();
                                  previewBitmap = null;
                              }
                              currentProcessingIndex++;
                              
                              runOnUiThread(() -> {
                                  btnMainAction.setEnabled(true);
                                  btnRetake.setEnabled(true);
                                  if (currentProcessingIndex < pendingUris.size()) {
                                      currentState = 1;
                                      dewarpView.showingPreview = false;
                                      loadUriIntoView(pendingUris.get(currentProcessingIndex));
                                      updateUI();
                                  } else {
                                      currentState = 0;
                                      dewarpView.showingPreview = false;
                                      Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                                      intent.setType("application/pdf");
                                      intent.putExtra(Intent.EXTRA_TITLE, "BatchScan_" + System.currentTimeMillis() + ".pdf");
                                      startActivityForResult(intent, REQ_SAVE_PDF);
                                  }
                              });
                          }).start();
                      }
                  });

                  controls.addView(btnRetake);
                  controls.addView(btnRotate);
                  controls.addView(btnMainAction);
                  root.addView(controls);

                  updateUI();
                  setContentView(root);
              }

              private void pickImages() {
                  Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                  intent.setType("image/*");
                  intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true); 
                  startActivityForResult(Intent.createChooser(intent, "可長按選取無數量上限的照片"), REQ_PICK_IMAGE);
              }

              private void loadUriIntoView(Uri uri) {
                  try (InputStream is = getContentResolver().openInputStream(uri)) {
                      BitmapFactory.Options options = new BitmapFactory.Options();
                      options.inJustDecodeBounds = true;
                      BitmapFactory.decodeStream(getContentResolver().openInputStream(uri), null, options);
                      
                      options.inSampleSize = calculateInSampleSize(options, 2000, 2000);
                      options.inJustDecodeBounds = false;
                      
                      Bitmap bmp = BitmapFactory.decodeStream(is, null, options);
                      if (bmp != null) {
                          dewarpView.setBitmap(bmp);
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "讀取照片失敗: " + uri.toString(), Toast.LENGTH_SHORT).show();
                  }
              }

              private int calculateInSampleSize(BitmapFactory.Options options, int reqWidth, int reqHeight) {
                  final int height = options.outHeight;
                  final int width = options.outWidth;
                  int inSampleSize = 1;
                  if (height > reqHeight || width > reqWidth) {
                      final int halfHeight = height / 2;
                      final int halfWidth = width / 2;
                      while ((halfHeight / inSampleSize) >= reqHeight && (halfWidth / inSampleSize) >= reqWidth) {
                          inSampleSize *= 2;
                      }
                  }
                  return inSampleSize;
              }

              private void updateUI() {
                  if (currentState == 0) {
                      tvStatus.setText("無限制批量掃描 - 就緒");
                      btnMainAction.setText("一次選取多張相片");
                      btnRotate.setVisibility(View.GONE);
                      btnRetake.setVisibility(View.GONE);
                      dewarpView.setVisibility(View.VISIBLE);
                  } else if (currentState == 1) {
                      tvStatus.setText("調整第 " + (currentProcessingIndex + 1) + " / " + pendingUris.size() + " 張");
                      btnMainAction.setText("預覽拉平結果");
                      btnRotate.setVisibility(View.VISIBLE);
                      btnRetake.setVisibility(View.GONE);
                  } else if (currentState == 2) {
                      tvStatus.setText("預覽第 " + (currentProcessingIndex + 1) + " / " + pendingUris.size() + " 張");
                      if (currentProcessingIndex == pendingUris.size() - 1) {
                          btnMainAction.setText("確認無誤，儲存 PDF");
                      } else {
                          btnMainAction.setText("確認無誤，處理下一張");
                      }
                      btnRotate.setVisibility(View.GONE);
                      btnRetake.setVisibility(View.VISIBLE);
                  }
                  dewarpView.invalidate();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != RESULT_OK || data == null) return;

                  if (requestCode == REQ_PICK_IMAGE) {
                      pendingUris.clear();
                      
                      for (File f : tempFiles) f.delete();
                      tempFiles.clear();
                      currentProcessingIndex = 0;
                      
                      if (previewBitmap != null) {
                          previewBitmap.recycle();
                          previewBitmap = null;
                      }

                      ClipData clipData = data.getClipData();
                      if (clipData != null) {
                          for (int i = 0; i < clipData.getItemCount(); i++) {
                              pendingUris.add(clipData.getItemAt(i).getUri());
                          }
                      } else if (data.getData() != null) {
                          pendingUris.add(data.getData());
                      }

                      if (!pendingUris.isEmpty()) {
                          currentState = 1;
                          dewarpView.showingPreview = false;
                          loadUriIntoView(pendingUris.get(0));
                          updateUI();
                      }
                  } else if (requestCode == REQ_SAVE_PDF) {
                      savePdfToUri(data.getData());
                  }
              }

              private void savePdfToUri(Uri uri) {
                  Toast.makeText(this, "正在打包 " + tempFiles.size() + " 頁的 PDF...", Toast.LENGTH_SHORT).show();
                  new Thread(() -> {
                      PdfDocument pdf = new PdfDocument();
                      for (int i = 0; i < tempFiles.size(); i++) {
                          PdfDocument.PageInfo pageInfo = new PdfDocument.PageInfo.Builder(A4_WIDTH, A4_HEIGHT, i + 1).create();
                          PdfDocument.Page page = pdf.startPage(pageInfo);
                          
                          Bitmap pageBmp = BitmapFactory.decodeFile(tempFiles.get(i).getAbsolutePath());
                          if (pageBmp != null) {
                              page.getCanvas().drawBitmap(pageBmp, 0, 0, null);
                              pageBmp.recycle();
                          }
                          pdf.finishPage(page);
                      }

                      try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                          pdf.writeTo(os);
                          runOnUiThread(() -> {
                              Toast.makeText(this, "PDF 儲存成功！(共 " + tempFiles.size() + " 頁)", Toast.LENGTH_LONG).show();
                              
                              for (File f : tempFiles) f.delete();
                              tempFiles.clear();
                              pendingUris.clear();
                              currentProcessingIndex = 0;
                              currentState = 0;
                              dewarpView.setBitmap(null);
                              updateUI();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "儲存失敗: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                      } finally {
                          pdf.close();
                      }
                  }).start();
              }

              private class DewarpView extends View {
                  Bitmap sourceBitmap;
                  boolean showingPreview = false;
                  PointF[] pts = new PointF[6];
                  int activePt = -1;
                  float scale = 1f, offsetX = 0f, offsetY = 0f;
                  Paint linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Paint ptPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

                  private static final float MAGNIFIER_RADIUS = 130f;
                  private static final float MAGNIFIER_FACTOR = 2.2f;
                  private static final float MAGNIFIER_OFFSET_Y = 220f;
                  private Paint magBorderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint magCrossPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint magFillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Matrix magMatrix = new Matrix();

                  DewarpView(Activity context) {
                      super(context);
                      linePaint.setColor(Color.CYAN);
                      linePaint.setStyle(Paint.Style.STROKE);
                      linePaint.setStrokeWidth(5f);

                      ptPaint.setStyle(Paint.Style.FILL);
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTextSize(38f);
                      textPaint.setTextAlign(Paint.Align.CENTER);

                      magBorderPaint.setColor(Color.WHITE);
                      magBorderPaint.setStyle(Paint.Style.STROKE);
                      magBorderPaint.setStrokeWidth(8f);

                      magCrossPaint.setColor(Color.RED);
                      magCrossPaint.setStyle(Paint.Style.STROKE);
                      magCrossPaint.setStrokeWidth(3f);
                  }

                  void rotateImage() {
                      if (sourceBitmap == null) return;
                      Matrix matrix = new Matrix();
                      matrix.postRotate(90);
                      Bitmap rotated = Bitmap.createBitmap(sourceBitmap, 0, 0, 
                              sourceBitmap.getWidth(), sourceBitmap.getHeight(), matrix, true);
                      setBitmap(rotated);
                  }

                  void setBitmap(Bitmap bmp) {
                      if (sourceBitmap != null && sourceBitmap != bmp) {
                          sourceBitmap.recycle();
                      }
                      sourceBitmap = bmp;
                      if (bmp == null) {
                          invalidate();
                          return;
                      }
                      
                      autoDetectPaperBounds(bmp);

                      BitmapShader shader = new BitmapShader(bmp, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP);
                      magFillPaint.setShader(shader);

                      invalidate();
                  }

                  private void autoDetectPaperBounds(Bitmap bmp) {
                      int w = bmp.getWidth();
                      int h = bmp.getHeight();
                      
                      float l = w * 0.15f, r = w * 0.85f, t = h * 0.15f, b = h * 0.85f;
                      int downscale = Math.max(1, Math.min(w, h) / 150);
                      int sw = w / downscale, sh = h / downscale;
                      Bitmap small = Bitmap.createScaledBitmap(bmp, sw, sh, false);

                      long totalBrightness = 0;
                      int[] pixels = new int[sw * sh];
                      small.getPixels(pixels, 0, sw, 0, 0, sw, sh);
                      
                      for (int c : pixels) {
                          totalBrightness += (Color.red(c) + Color.green(c) + Color.blue(c)) / 3;
                      }
                      int avgBrightness = (int) (totalBrightness / pixels.length);
                      int threshold = Math.min(255, avgBrightness + 25); 

                      int minX = sw, maxX = 0, minY = sh, maxY = 0;
                      boolean found = false;

                      for (int y = 0; y < sh; y++) {
                          for (int x = 0; x < sw; x++) {
                              int c = pixels[y * sw + x];
                              int bright = (Color.red(c) + Color.green(c) + Color.blue(c)) / 3;
                              if (bright > threshold) {
                                  if (x < minX) minX = x;
                                  if (x > maxX) maxX = x;
                                  if (y < minY) minY = y;
                                  if (y > maxY) maxY = y;
                                  found = true;
                              }
                          }
                      }

                      if (found && (maxX - minX > sw * 0.3) && (maxY - minY > sh * 0.3)) {
                          l = minX * downscale;
                          r = maxX * downscale;
                          t = minY * downscale;
                          b = maxY * downscale;
                      }
                      small.recycle();

                      pts[0] = new PointF(l, t);
                      pts[1] = new PointF((l + r) / 2f, t + (h * 0.02f)); 
                      pts[2] = new PointF(r, t);
                      pts[3] = new PointF(r, b);
                      pts[4] = new PointF((l + r) / 2f, b - (h * 0.02f)); 
                      pts[5] = new PointF(l, b);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      if (sourceBitmap == null) {
                          canvas.drawText("請點擊下方按鈕選取任意數量的相片", getWidth() / 2f, getHeight() / 2f, textPaint);
                          return;
                      }

                      Bitmap displayBmp = (showingPreview && previewBitmap != null) ? previewBitmap : sourceBitmap;
                      float vw = getWidth(), vh = getHeight();
                      float bw = displayBmp.getWidth(), bh = displayBmp.getHeight();
                      scale = Math.min(vw / bw, vh / bh) * 0.92f;
                      offsetX = (vw - bw * scale) / 2f;
                      offsetY = (vh - bh * scale) / 2f;

                      canvas.save();
                      canvas.translate(offsetX, offsetY);
                      canvas.scale(scale, scale);
                      canvas.drawBitmap(displayBmp, 0, 0, null);
                      canvas.restore();
                      
                      if (showingPreview) return;

                      PointF[] scr = new PointF[6];
                      for (int i = 0; i < 6; i++) {
                          scr[i] = new PointF(pts[i].x * scale + offsetX, pts[i].y * scale + offsetY);
                      }

                      Path path = new Path();
                      float cxTop = 2 * scr[1].x - 0.5f * (scr[0].x + scr[2].x);
                      float cyTop = 2 * scr[1].y - 0.5f * (scr[0].y + scr[2].y);
                      float cxBot = 2 * scr[4].x - 0.5f * (scr[5].x + scr[3].x);
                      float cyBot = 2 * scr[4].y - 0.5f * (scr[5].y + scr[3].y);

                      path.moveTo(scr[0].x, scr[0].y);
                      path.quadTo(cxTop, cyTop, scr[2].x, scr[2].y);
                      path.lineTo(scr[3].x, scr[3].y);
                      path.quadTo(cxBot, cyBot, scr[5].x, scr[5].y);
                      path.close();
                      canvas.drawPath(path, linePaint);

                      for (int i = 0; i < 6; i++) {
                          ptPaint.setColor((i == 1 || i == 4) ? Color.YELLOW : Color.GREEN);
                          canvas.drawCircle(scr[i].x, scr[i].y, 26f, ptPaint);
                      }

                      if (activePt != -1) {
                          float focusScrX = scr[activePt].x;
                          float focusScrY = scr[activePt].y;
                          float magCenterX = focusScrX;
                          float magCenterY = focusScrY - MAGNIFIER_OFFSET_Y;

                          if (magCenterY - MAGNIFIER_RADIUS < 20f) {
                              magCenterY = focusScrY + MAGNIFIER_OFFSET_Y;
                          }
                          magCenterX = Math.max(MAGNIFIER_RADIUS + 20f, Math.min(getWidth() - MAGNIFIER_RADIUS - 20f, magCenterX));

                          magMatrix.reset();
                          magMatrix.postScale(scale * MAGNIFIER_FACTOR, scale * MAGNIFIER_FACTOR);
                          magMatrix.postTranslate(
                                  magCenterX - pts[activePt].x * scale * MAGNIFIER_FACTOR,
                                  magCenterY - pts[activePt].y * scale * MAGNIFIER_FACTOR
                          );
                          magFillPaint.getShader().setLocalMatrix(magMatrix);

                          canvas.drawCircle(magCenterX, magCenterY, MAGNIFIER_RADIUS, magFillPaint);
                          canvas.drawCircle(magCenterX, magCenterY, MAGNIFIER_RADIUS, magBorderPaint);

                          canvas.drawLine(magCenterX - 25f, magCenterY, magCenterX + 25f, magCenterY, magCrossPaint);
                          canvas.drawLine(magCenterX, magCenterY - 25f, magCenterX, magCenterY + 25f, magCrossPaint);
                      }
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (sourceBitmap == null || showingPreview) return false;
                      float tx = (event.getX() - offsetX) / scale;
                      float ty = (event.getY() - offsetY) / scale;

                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              activePt = -1;
                              float minDist = 90f / scale;
                              for (int i = 0; i < 6; i++) {
                                  float d = (float) Math.hypot(pts[i].x - tx, pts[i].y - ty);
                                  if (d < minDist) {
                                      minDist = d;
                                      activePt = i;
                                  }
                              }
                              if (activePt != -1) invalidate();
                              return activePt != -1;
                          case MotionEvent.ACTION_MOVE:
                              if (activePt != -1) {
                                  pts[activePt].x = Math.max(0, Math.min(sourceBitmap.getWidth() - 1, tx));
                                  pts[activePt].y = Math.max(0, Math.min(sourceBitmap.getHeight() - 1, ty));
                                  invalidate();
                              }
                              return true;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              activePt = -1;
                              invalidate();
                              return true;
                      }
                      return super.onTouchEvent(event);
                  }

                  Bitmap processDewarp(boolean enhance) {
                      int srcW = sourceBitmap.getWidth();
                      int srcH = sourceBitmap.getHeight();
                      int[] srcPixels = new int[srcW * srcH];
                      sourceBitmap.getPixels(srcPixels, 0, srcW, 0, 0, srcW, srcH);

                      int[] dstPixels = new int[A4_WIDTH * A4_HEIGHT];

                      float cxTop = 2 * pts[1].x - 0.5f * (pts[0].x + pts[2].x);
                      float cyTop = 2 * pts[1].y - 0.5f * (pts[0].y + pts[2].y);
                      float cxBot = 2 * pts[4].x - 0.5f * (pts[5].x + pts[3].x);
                      float cyBot = 2 * pts[4].y - 0.5f * (pts[5].y + pts[3].y);

                      int steps = A4_WIDTH * 2;
                      float[] arcLen = new float[steps + 1];
                      float prevX = pts[0].x, prevY = pts[0].y;
                      for (int i = 1; i <= steps; i++) {
                          float t = i / (float) steps;
                          float u = 1f - t;
                          float x = u * u * pts[0].x + 2 * u * t * cxTop + t * t * pts[2].x;
                          float y = u * u * pts[0].y + 2 * u * t * cyTop + t * t * pts[2].y;
                          arcLen[i] = arcLen[i - 1] + (float) Math.hypot(x - prevX, y - prevY);
                          prevX = x;
                          prevY = y;
                      }
                      float totalLen = arcLen[steps];

                      int searchIdx = 0;
                      for (int x = 0; x < A4_WIDTH; x++) {
                          float target = (x / (float) (A4_WIDTH - 1)) * totalLen;
                          while (searchIdx < steps && arcLen[searchIdx] < target) {
                              searchIdx++;
                          }
                          float t = searchIdx / (float) steps;
                          float u = 1f - t;

                          float tx = u * u * pts[0].x + 2 * u * t * cxTop + t * t * pts[2].x;
                          float ty = u * u * pts[0].y + 2 * u * t * cyTop + t * t * pts[2].y;
                          float bx = u * u * pts[5].x + 2 * u * t * cxBot + t * t * pts[3].x;
                          float by = u * u * pts[5].y + 2 * u * t * cyBot + t * t * pts[3].y;

                          for (int y = 0; y < A4_HEIGHT; y++) {
                              float v = y / (float) (A4_HEIGHT - 1);
                              int sx = Math.min(srcW - 1, Math.max(0, (int) (tx + v * (bx - tx))));
                              int sy = Math.min(srcH - 1, Math.max(0, (int) (ty + v * (by - ty))));
                              int c = srcPixels[sy * srcW + sx];

                              if (enhance) {
                                  int r = (c >> 16) & 0xFF;
                                  int g = (c >> 8) & 0xFF;
                                  int b = c & 0xFF;
                                  int lum = (r * 77 + g * 150 + b * 29) >> 8;
                                  int val = Math.min(255, Math.max(0, (int) ((lum - 110) * 1.8f + 135)));
                                  c = 0xFF000000 | (val << 16) | (val << 8) | val;
                              }
                              dstPixels[y * A4_WIDTH + x] = c;
                          }
                      }

                      Bitmap out = Bitmap.createBitmap(A4_WIDTH, A4_HEIGHT, Bitmap.Config.ARGB_8888);
                      out.setPixels(dstPixels, 0, A4_WIDTH, 0, 0, A4_WIDTH, A4_HEIGHT);
                      return out;
                  }
              }
          }
          EOF

      - name: Build Debug & Release APK
        run: gradle assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A4-Dewarp-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
