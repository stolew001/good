name: Build A4 Dewarp Scanner APK & AAB
​on:
push:
branches: [ main, master ]
workflow_dispatch:
​jobs:
build-android:
runs-on: ubuntu-latest
​steps:
- name: 1. 檢出儲存庫 (Checkout)
uses: actions/checkout@v4
​- name: 2. 設定 Java 17 環境 (Setup JDK 17)
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: 3. 設定 Gradle 編譯工具 (Setup Gradle)
uses: gradle/actions/setup-gradle@v3
with:
gradle-version: '8.7'
​- name: 4. 自動生成金鑰與 Android 專案原始碼
run: |
mkdir -p app/src/main/java/com/a4scanner/dewarp
mkdir -p app/src/main/res/xml
mkdir -p app/src/main/res/values
​# 產生簽名金鑰 (讓編譯出的 APK 可直接安裝於手機，AAB 可用於測試上架)
keytool -genkey -v 
-keystore release-key.jks 
-alias a4scanner 
-keyalg RSA 
-keysize 2048 
-validity 10000 
-storepass android123 
-keypass android123 
-dname "CN=A4Scanner, OU=Mobile, O=A4Scanner, L=HK, S=HK, C=HK"
​cat << 'EOF' > settings.gradle
pluginManagement {
repositories {
google()
mavenCentral()
gradlePluginPortal()
}
}
dependencyResolutionManagement {
repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
repositories {
google()
mavenCentral()
}
}
rootProject.name = "A4DewarpScanner"
include(":app")
EOF
​cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
EOF
​cat << 'EOF' > build.gradle
plugins {
id 'com.android.application' version '8.4.0' apply false
id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
EOF
​cat << 'EOF' > app/build.gradle
plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}
​android {
namespace 'com.a4scanner.dewarp'
compileSdk 34
​defaultConfig {
applicationId "com.a4scanner.dewarp"
minSdk 24
targetSdk 34
versionCode 1
versionName "1.0.0"
}
​signingConfigs {
release {
storeFile file("../release-key.jks")
storePassword "android123"
keyAlias "a4scanner"
keyPassword "android123"
}
}
​buildTypes {
release {
signingConfig signingConfigs.release
minifyEnabled false
}
}
​compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}
​kotlinOptions {
jvmTarget = '17'
}
}
​dependencies {
implementation 'androidx.core:core-ktx:1.12.0'
}
EOF
​cat << 'EOF' > app/src/main/res/xml/file_paths.xml
<?xml version="1.0" encoding="utf-8"?>
<paths>
<cache-path name="camera_photos" path="." />
</paths>
EOF
​cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
​<application
android:allowBackup="true"
android:label="A4 捲曲拉平掃描器"
android:supportsRtl="true"
android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
​<activity
android:name=".MainActivity"
android:exported="true"
android:screenOrientation="portrait">
<intent-filter>
<action android:name="android.intent.action.MAIN" />
<category android:name="android.intent.category.LAUNCHER" />
</intent-filter>
</activity>
​<provider
android:name="androidx.core.content.FileProvider"
android:authorities="${applicationId}.fileprovider"
android:exported="false"
android:grantUriPermissions="true">
<meta-data
android:name="android.support.FILE_PROVIDER_PATHS"
android:resource="@xml/file_paths" />
</provider>
</application>
</manifest>
EOF
